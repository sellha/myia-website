<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Thank You</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://myiatech.com/thanks/" />
    <link rel="icon" href="/favicon-32.png?v=9" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=9" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" sizes="180x180" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="coming" aria-label="Thank you">
        <div class="heroCopy">
          <p class="kicker">You are on the early list</p>
          <h1 class="headline">Thank <span>you</span></h1>
          <p class="subhead">
            It would be our pleasure to reach out as soon as we have meaningful
            updates about the MYIA project.
          </p>

          <ul class="signalList" aria-label="MYIA launch signals">
            <li>Message received</li>
            <li>No spam</li>
            <li>Coming soon</li>
          </ul>

          <div class="links">
            <a class="ctaLink" href="/">Back to home</a>
            <a
              class="ctaLink ctaLink--email"
              href="mailto:contact@myiatech.com?subject=MYIA%20Tech%20-%20Hello"
              >contact@myiatech.com</a>
            <button class="ctaLink copyBtn" type="button" data-copy="contact@myiatech.com">
              Copy email
            </button>
          </div>
        </div>

        <div class="heroVisual" aria-hidden="true">
          <div class="logoStage">
            <span class="orbitDot orbitDot--a"></span>
            <span class="orbitDot orbitDot--b"></span>
            <span class="orbitDot orbitDot--c"></span>
            <div class="logoLockup">
              <img
                class="logoLockup__mark"
                src="/myia-logo.png"
                alt=""
                width="220"
                height="220"
                loading="eager"
              />
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <small>© <span id="year"></span> MYIA. All rights reserved.</small>
      </footer>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
