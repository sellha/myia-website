<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Thank You</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://myiatech.com/thanks/" />
    <link rel="icon" href="/favicon-32.png?v=9" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=9" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" sizes="180x180" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap wrap--thanks">
      <section class="coming coming--thanks" aria-label="Thank you">
        <div class="ambient" aria-hidden="true">
          <span class="glow glow--a"></span>
          <span class="glow glow--b"></span>
          <span class="line line--a"></span>
        </div>

        <div class="thankCard">
          <img class="thankLogo" src="/myia-logo.png" alt="MYIA" width="164" height="164" />
          <p class="kicker">You are on the MYIA early list</p>
          <h1 class="headline headline--thanks">Thank <span>you</span></h1>
          <p class="subhead subhead--thanks">
            We would love to reach out when we have meaningful news about MYIA,
            the private social app bringing feed, profile, messaging, calls,
            matching and personal AI into one mobile experience.
          </p>

          <div class="thankActions">
            <a class="form__btn form__btn--link" href="/">Back to home</a>
            <a
              class="ctaLink ctaLink--email"
              href="mailto:contact@myiatech.com?subject=MYIA%20Tech%20-%20Hello"
              >contact@myiatech.com</a
            >
          </div>
        </div>
      </section>

      <footer class="footer">
        <small>© <span id="year"></span> MYIA. All rights reserved.</small>
      </footer>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
