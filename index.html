<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />

    <title>Coming Soon</title>
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://myiatech.com/" />
    <meta
      name="description"
      content="MYIA is coming soon. Leave your email to get notified when we share updates."
    />

    <meta property="og:title" content="MYIA | Coming Soon" />
    <meta property="og:description" content="MYIA is coming soon. Join the early list." />
    <meta property="og:url" content="https://myiatech.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MYIA | Coming Soon" />
    <meta name="twitter:description" content="MYIA is coming soon. Join the early list." />

    <link rel="icon" href="/favicon-32.png?v=9" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=9" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MYIA Tech",
        "url": "https://myiatech.com/",
        "email": "contact@myiatech.com"
      }
    </script>
  </head>
  <body>
    <main class="wrap">
      <section class="coming" aria-label="MYIA coming soon">
        <div class="shape shape--mint" aria-hidden="true"></div>
        <div class="shape shape--gold" aria-hidden="true"></div>
        <div class="shape shape--navy" aria-hidden="true"></div>

        <img class="logo" src="/myia-logo-transparent.png" alt="MYIA" width="220" height="213" />

        <p class="kicker">Private social app</p>
        <h1 class="headline">Coming soon</h1>
        <p class="subhead">
          MYIA is preparing a new social experience. Leave your email and we will keep you posted.
        </p>

        <div class="notify" id="notify">
          <form
            class="form"
            name="notify"
            method="POST"
            action="https://formspree.io/f/mjgewren"
            novalidate
          >
            <input
              type="hidden"
              name="message"
              value="I'd like to be notified when you have news about the MYIA project."
            />
            <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />

            <label class="sr-only" for="email">Email</label>
            <div class="form__row">
              <input
                id="email"
                name="email"
                class="form__input"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                inputmode="email"
                aria-describedby="email-msg"
                required
              />
              <button class="form__btn" type="submit">Get notified</button>
            </div>
            <p class="fieldMsg" id="email-msg" aria-live="polite"></p>
            <p class="form__status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="contact">
          <a href="mailto:contact@myiatech.com?subject=MYIA%20Tech%20-%20Hello">contact@myiatech.com</a>
          <button type="button" data-copy="contact@myiatech.com">Copy email</button>
        </div>
      </section>

      <footer class="footer">
        <small>© <span id="year"></span> MYIA. All rights reserved.</small>
      </footer>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
